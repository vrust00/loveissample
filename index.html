<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="css/reset.css">
   <link rel="stylesheet" href="css/style.css">
   <title>Basic Design</title>
</head>
<body>
   <div class="main">
      <img src="images\background-desktop.svg" alt="" class="main__bg">
   </div>

   <h1 class="main__slogan">
      Открой для себя моменты нежности и близости
   </h1>

   <h2 class="main__name">Иван</h2>
   <h2 class="main__and">&</h2>
   <h2 class="main__name">Ариша</h2>


   <h1 class="main__title-tv">Любовь это...</h1>
   <h1 class="main__title-eng-tv">Love is...</h1>

      <h1 class="main__subtitle-tv">...пересматривать совместные видео</h1>
   <h1 class="main__subtitle-eng-tv">...watching videos together</h1>

   <img src="images\photo1.jpg" alt="" class="main__photo">
   <img src="images\photo2.jpg" alt="" class="main__photo">
   <img src="images\photo3.jpg" alt="" class="main__photo">
   <img src="images\photo4.jpg" alt="" class="main__photo">
   <img src="images\photo5.jpg" alt="" class="main__photo">
   <img src="images\photo6.jpg" alt="" class="main__photo">

   <video autoplay muted loop playsinline class="main__video"> 
      <source src="photos\video1.mp4" >
   </video>
   
   <div class="main__timer">
      <div class="main__timer-nums">
         <div class="main__timer-number" id="days">00</div>
         <div class="main__timer-number" id="hours">00</div>
         <div class="main__timer-number" id="minutes">00</div>
         <div class="main__timer-number" id="seconds">00</div>
      </div>
      <div class="main__timer-labels">
         <div class="main__timer-label">ДНЕЙ</div>
         <div class="main__timer-label">ЧАСОВ</div>
         <div class="main__timer-label">МИНУТ</div>
         <div class="main__timer-label">СЕКУНД</div>
      </div>
   </div>
   <script src="js\timer.js"></script>

</body>
</html>
